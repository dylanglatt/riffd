# requirements.lock — fully pinned, transitive deps included.
# Frozen from the working venv (macOS arm64 / CPython 3.11.15).
#
# Regenerate with:  ./venv/bin/pip freeze   (then re-apply the exclusions below)
#
# ── basic-pitch is deliberately ABSENT from this file ─────────────────────────
# On Linux + Python >= 3.11 basic-pitch 0.4.0's metadata carries a plain
#   Requires-Dist: tensorflow>=2.4.1,<2.15.1
# so a normal `pip install -r <anything listing basic-pitch>` resolves and
# installs TensorFlow — which basic_pitch then prefers over ONNX on sight,
# costing ~460MB per inference child and ~3x the wall clock for byte-identical
# notes. Listing it here would have defeated the whole point of the lock.
#
# It is pinned in requirements-basic-pitch.txt instead and installed with
# --no-deps by build.sh; the deps it actually needs at runtime (onnxruntime,
# librosa, mir_eval, pretty_midi, resampy, scikit-learn, scipy,
# typing-extensions, setuptools) are pinned below like any other dependency.
# Do not "fix" this file by adding basic-pitch back.
#
# coremltools is also excluded: it is basic-pitch's macOS-only dependency, is
# not used by this app, and installing it on Linux would make basic_pitch's
# CoreML backend visible for no reason.
#
# Never add tensorflow. See CLAUDE.md "Basic Pitch runs on ONNX".
